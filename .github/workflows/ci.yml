# CI/CD Nồi Thần
# - Mọi push/PR: lint, typecheck, unit test, build, e2e.
# - Push lên main (qua hết kiểm tra): build image trên GitHub, chuyển sang VPS bằng SSH
#   (docker save | docker load, không cần registry), rồi chạy lại container.
#   VPS không phải build nên không tốn RAM.
#
# Secrets cần đặt (Settings → Secrets and variables → Actions):
#   VPS_HOST     IP hoặc domain VPS
#   VPS_USER     user SSH (vd root)
#   VPS_SSH_KEY      private key riêng cho CI; public key nằm trong authorized_keys của VPS
#                    kèm command="/opt/noi-than/deploy/ci-receive.sh" (xem script đó)
#   VPS_KNOWN_HOSTS  dòng known_hosts của VPS (ssh-keyscan)
# Trên VPS cần sẵn /opt/noi-than (git clone) và /opt/noi-than/deploy/.env.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # e2e dùng Chrome có sẵn trên runner + PocketBase tải về .tools/
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: web/test-results
          retention-days: 7

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: |
          TAG="${TAG::7}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          docker build -f deploy/Dockerfile --build-arg APP_VERSION="$TAG" -t "noi-than:$TAG" .

      - name: Nạp khoá SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      # Khoá này bị trói vào deploy/ci-receive.sh (forced command trong authorized_keys):
      # nó chỉ nhận image rồi chạy lại app, hỏng thì tự quay về bản cũ.
      - name: Chuyển image sang VPS và chạy
        run: |
          docker save "noi-than:$TAG" | gzip \
            | ssh -T -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=20 \
                "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "deploy $TAG $GITHUB_SHA"

      - name: Kiểm tra trang thật
        run: curl -fsS --retry 5 --retry-delay 3 "${{ vars.SITE_URL || 'https://noi-than.duckdns.org' }}/api/health"
